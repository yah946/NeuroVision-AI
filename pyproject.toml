[project]
name = "neuro-vision-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed", email = "mohamedsehrane314@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pathlib>=1.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.0",
    "tensorflow>=2.22.0rc0",
]

[project.scripts]
neuro-vision-ai = "neuro_vision_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
